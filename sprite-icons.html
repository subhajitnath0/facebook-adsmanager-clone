<style>
  :root{--ink:#1c2b33;--muted:#65676b;--line:#dadde1;--blue:#0b66c3}
  body{margin:0;font-family:"Segoe UI",Helvetica,Arial,sans-serif;background:#f0f2f5;color:var(--ink)}
  header{padding:20px 24px 8px} h1{margin:0 0 4px;font-size:22px} p{margin:4px 0;color:var(--muted);font-size:14px;max-width:820px;line-height:1.5}
  code{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:13px}
  .tools{display:flex;gap:10px;align-items:center;padding:8px 24px 0;flex-wrap:wrap}
  input{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;width:240px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:16px 24px 40px}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font:inherit;color:inherit}
  .card:hover{border-color:var(--blue)} .card b{font-size:12px;font-weight:600} .card small{font-size:11px;color:var(--muted)}
  .well{height:56px;display:grid;place-items:center}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:.2s}
  .toast.on{opacity:1}
  .sp{--s:20;--k:calc(var(--s) / var(--m));
      display:inline-block;flex-shrink:0;vertical-align:middle;
      width:calc(var(--w) * var(--k) * 1px);height:calc(var(--h) * var(--k) * 1px);
      background-image:url("icon-sprite.webp");background-repeat:no-repeat;
      background-size:calc(285px * var(--k)) calc(902px * var(--k));
      background-position:calc(var(--x) * var(--k) * -1px) calc(var(--y) * var(--k) * -1px)}
  .sp.s12{--s:12}.sp.s14{--s:14}.sp.s16{--s:16}.sp.s18{--s:18}.sp.s22{--s:22}
  .sp.s24{--s:24}.sp.s26{--s:26}.sp.s28{--s:28}.sp.s32{--s:32}.sp.s40{--s:40}
  .sp.light{filter:invert(1) brightness(1.6)}               /* black icon -> white, for dark backgrounds */
  .rail-btn.active .sp{filter:invert(27%) sepia(92%) saturate(1900%) hue-rotate(201deg) brightness(.9)} /* black -> blue */
  .btn:disabled .sp{opacity:.3}

<div class="toast" id="t"></div>
<script>
  const cards=[...document.querySelectorAll('.card')];
  function filter(q){q=q.trim().toLowerCase();let n=0;cards.forEach(c=>{const on=c.dataset.n.includes(q);c.style.display=on?'':'none';n+=on});count.textContent=n+' icons'}
  function copy(el){const tag='<i class="sp sp-'+el.dataset.n+'"></i>';
    (navigator.clipboard?navigator.clipboard.writeText(tag):Promise.reject()).catch(()=>{});
    t.textContent='Copied: '+tag;t.classList.add('on');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('on'),1400)}
  filter('');
</script>
